# Local development database. Run: docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gok
      POSTGRES_PASSWORD: gok
      POSTGRES_DB: gok
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gok -d gok']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
